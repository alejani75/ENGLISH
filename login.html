<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Basic Login</title>
<style>
  :root{--bg:#f4f6f8;--card:#ffffff;--accent:#0069ff;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;background:var(--bg);display:flex;align-items:center;justify-content:center;height:100vh}
  .card{width:340px;background:var(--card);padding:24px;border-radius:10px;box-shadow:0 6px 18px rgba(25,25,25,0.08)}
  h1{margin:0 0 12px;font-size:20px}
  label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
  input[type="text"],input[type="password"]{width:100%;padding:10px 12px;margin-top:6px;border:1px solid #e6e9ee;border-radius:8px;font-size:14px}
  .row{display:flex;gap:8px;align-items:center;margin-top:16px}
  button{cursor:pointer;border:0;padding:10px 14px;border-radius:8px;font-size:14px}
  .btn-login{background:var(--accent);color:white;flex:1}
  .btn-cancel{background:#eef2ff;color:var(--accent);flex:1}
  .message{height:18px;margin-top:10px;font-size:13px;color:#d0342c}
  .hint{margin-top:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="loginTitle">
    <h1 id="loginTitle">Login</h1>

    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" placeholder="your username" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="your password" />

    <div class="message" id="message" aria-live="polite"></div>

    <div class="row">
      <button class="btn-cancel" id="cancelBtn" type="button">Cancel</button>
      <button class="btn-login" id="loginBtn" type="button">Login</button>
    </div>

    <p class="hint">Demo: use <strong>admin</strong> / <strong>1234</strong> — client-side only.</p>
  </main>

<script>
(function(){
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  const msgEl = document.getElementById('message');
  const loginBtn = document.getElementById('loginBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  passEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') login();
  });
  userEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') passEl.focus();
  });

  loginBtn.addEventListener('click', login);
  cancelBtn.addEventListener('click', function(){
    userEl.value = '';
    passEl.value = '';
    msgEl.textContent = '';
    userEl.focus();
  });

  function setMessage(text, isError = true){
    msgEl.textContent = text;
    msgEl.style.color = isError ? '#d0342c' : '#0b6b2b';
  }

  function login(){
    const username = userEl.value.trim();
    const password = passEl.value;

    if (!username || !password){
      setMessage('Please enter username and password.');
      return;
    }

    // Demo-only: replace with fetch(...) to your authentication endpoint
    // Example:
    // fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password})})
    //   .then(r => r.json()).then(handleResponse)...

    // Simple demo credential check (client-side only)
    if (username === 'admin' && password === '1234'){
      setMessage('Login successful!', false);
      // Redirect or call your app logic:
      // window.location.href = '/dashboard';
    } else {
      setMessage('Invalid credentials.');
    }
  }

  // Focus first field on load
  userEl.focus();
})();
</script>
</body>
</html>
